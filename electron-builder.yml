appId: dev.icitte.carnet-sante-extractor
productName: Carnet Sante Extractor
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    target: dmg
    arch: universal
  category: public.app-category.utilities
linux:
  target: AppImage
  category: Utility
