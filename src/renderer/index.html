<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Carnet Santé Extractor</title>
  </head>
  <body>
    <header id="bar">
      <button id="start" class="primary" disabled>Extraire mon dossier de santé</button>
      <div id="progress" class="progress" hidden>
        <div id="progress-fill"></div>
      </div>
      <span id="step">Connectez-vous à Carnet Santé ci-dessous, puis cliquez sur Extraire.</span>
      <span id="spacer"></span>
      <button id="open" class="ghost">Dossier de sortie</button>
      <button id="debug" class="ghost icon" title="Outils de débogage" aria-label="Outils de débogage">⚙</button>
    </header>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
